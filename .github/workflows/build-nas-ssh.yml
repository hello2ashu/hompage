name: Build and push nas-ssh image to GHCR

on:
  push:
    branches:
      - main
    paths:
      - "nas-ssh/**"
      - ".github/workflows/build-nas-ssh.yml"

  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/nas-ssh

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Login to GitHub Container Registry
      # --------------------------------------------------
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------
      # Docker Buildx
      # --------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --------------------------------------------------
      # Build and push NAS-SSH
      # --------------------------------------------------
      - name: Build and push nas-ssh
        uses: docker/build-push-action@v6
        with:
          context: ./nas-ssh
          file: ./nas-ssh/Dockerfile

          push: true

          platforms: |
            linux/amd64
            linux/arm64

          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --------------------------------------------------
      # Trigger Dockhand deployment
      # --------------------------------------------------
      - name: Notify Dockhand
        if: success()
        env:
          DOCKHAND_WEBHOOK_URL: ${{ secrets.DOCKHAND_NASSSH_WEBHOOK_SECRET }}
          DOCKHAND_WEBHOOK_SECRET: ${{ secrets.DOCKHAND_NASSSH_WEBHOOK_SECRET }}

        run: |
          set -euo pipefail

          PAYLOAD='{}'

          SIGNATURE="sha256=$(printf '%s' "$PAYLOAD" \
            | openssl dgst -sha256 \
            -hmac "$DOCKHAND_WEBHOOK_SECRET" \
            | awk '{print $NF}')"

          echo "Triggering Dockhand deployment..."

          HTTP_CODE=$(curl \
            --silent \
            --show-error \
            --output /tmp/dockhand-response.txt \
            --write-out "%{http_code}" \
            --request POST \
            "$DOCKHAND_WEBHOOK_URL" \
            --header "Content-Type: application/json" \
            --header "X-GitHub-Event: push" \
            --header "X-Hub-Signature-256: $SIGNATURE" \
            --data "$PAYLOAD")

          echo "Dockhand HTTP status: $HTTP_CODE"

          cat /tmp/dockhand-response.txt

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Dockhand webhook failed."
            exit 1
          fi

          echo "Dockhand webhook triggered successfully."
