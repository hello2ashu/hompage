name: Build and push image to GHCR

on:
  push:
    branches: [main]
    paths:
      - "github-repo-sync/**"
      - ".github/workflows/build-github-repo-sync.yml"
  workflow_dispatch: {}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/github-repo-sync

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./github-repo-sync
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify Dockhand
        if: success()
        run: |
          curl -X POST "${{ secrets.DOCKHAND_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "image": "ghcr.io/${{ github.repository_owner }}/github-repo-sync:latest",
              "tag": "latest",
              "commit": "${{ github.sha }}"
            }'
