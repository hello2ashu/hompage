services:
  homepage:
    # ...unchanged, as you have it...

  nas-ssh:
    image: tsl0922/ttyd:latest
    container_name: nas-ssh
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:7681:7681"   # bind to loopback only — DSM's reverse proxy runs on the host
    volumes:
      - /volume1/docker/nas-ssh/keys:/keys:ro
    command:
      - ttyd
      - -p
      - "7681"
      - -c
      - "${TTYD_USER}:${TTYD_PASS}"
      - -t
      - titleFixed=NAS
      - --ping-interval
      - "30"
      - ssh
      - -i
      - /keys/id_ed25519
      - -o
      - UserKnownHostsFile=/keys/known_hosts
      - -o
      - StrictHostKeyChecking=yes
      - homeuser@nas-host

networks:
  bookorbit-deploy_default:
    external: true
